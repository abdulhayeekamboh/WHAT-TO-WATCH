<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="What to Watch browser extension" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#10224d"/>
      <stop offset="1" stop-color="#1a73e8"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="wtwLogoGrad" x1="70" y1="90" x2="154" y2="174" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c6b4ff"/>
      <stop offset="55%" stop-color="#92c7ff"/>
      <stop offset="100%" stop-color="#d5a8ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="380" rx="24" fill="url(#bg)"/>
  <circle cx="1080" cy="40" r="170" fill="#ffffff" opacity="0.05"/>
  <circle cx="120" cy="360" r="140" fill="#ffffff" opacity="0.04"/>

  <!-- poster cards -->
  <g transform="translate(760 70)">
    <rect x="0"   y="40" width="120" height="180" rx="12" fill="url(#card)" stroke="#fff" stroke-opacity="0.25"/>
    <rect x="140" y="10" width="120" height="180" rx="12" fill="url(#card)" stroke="#fff" stroke-opacity="0.25"/>
    <rect x="280" y="60" width="120" height="180" rx="12" fill="url(#card)" stroke="#fff" stroke-opacity="0.25"/>
    <g fill="#fff" fill-opacity="0.85">
      <path d="M48 112l30 18-30 18z"/>
      <path d="M188 82l30 18-30 18z"/>
      <path d="M328 132l30 18-30 18z"/>
    </g>
    <g fill="#f9ab00" font-family="Arial, sans-serif" font-size="14" font-weight="700">
      <text x="14" y="206">★ 8.4</text>
      <text x="154" y="176">★ 7.9</text>
      <text x="294" y="226">★ 8.8</text>
    </g>
  </g>

  <!-- icon: W logo mark (matches the extension icons) -->
  <g transform="translate(70 90) scale(1.3125)">
    <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#wtwLogoGrad)" fill-opacity="0.22" stroke="url(#wtwLogoGrad)" stroke-opacity="0.65" stroke-width="1.5"/>
    <path d="M14 22 L20.5 42 L26.5 27.5 L32.5 42 L39 22" stroke="url(#wtwLogoGrad)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M46 14 L48.2 19.8 L54 22 L48.2 24.2 L46 30 L43.8 24.2 L38 22 L43.8 19.8 Z" fill="url(#wtwLogoGrad)" opacity="0.92"/>
  </g>

  <!-- text -->
  <g font-family="'Segoe UI', Roboto, Arial, sans-serif" fill="#fff">
    <text x="70" y="240" font-size="56" font-weight="700">What to Watch</text>
    <text x="70" y="282" font-size="22" fill="#cfe0ff">Google's movie &amp; TV showcase, right inside your search results.</text>
    <text x="70" y="322" font-size="16" fill="#9ec0ff">Genre filters  •  Year &amp; language lists  •  Full details panel  •  Powered by TMDB</text>
  </g>
</svg>
